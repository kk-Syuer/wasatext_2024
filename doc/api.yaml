openapi: 3.0.0
info: 
  description: WASA Text, chat app backend REST API
  title: WASA Text
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: Development server

components:
  # 1) Define the security scheme type (HTTP bearer)
  securitySchemes:
    bearerAuth: # arbitrary name for the security scheme
      type: http
      scheme: bearer
      bearerFormat: JWT # optional, arbitrary value for documentation purposes
      description: JWT token for authentication

  schemas:

    Id:
      type: string
      description: Unique identifier
      pattern: '^[a-zA-Z0-9-]{3,16}$'
      minLength: 3
      maxLength: 16

    Uniquename:
      type: string
      description: Unique displayed name
      pattern: '^[a-zA-Z0-9-]{3,16}$'
      minLength: 3
      maxLength: 16

    Timestamp:
      type: string
      format: date-time
      description: Standard ISO 8601 timestamp
      minLength: 10
      maxLength: 29
    
    Url:
      type: string
      format: uri
      pattern: '^https?://[^\s/$.?#].[^\s]*$'
      minLength: 11
      maxLength: 2048
      description: Valid URL

    User:
      description: A user in the WASA Text application.
      type: object
      required: [id, username, joinedAt]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        username:
          $ref: "#/components/schemas/Uniquename"
        profilePhoto:
          $ref: "#/components/schemas/Url"
        joinedAt:
          $ref: "#/components/schemas/Timestamp"

    Conversation:
      description: conversation where to send and receive messages
      type: object
      required: [id, type, participants, lastMessage]
      properties: 
        id:
          $ref: "#/components/schemas/Id"
        type:
          type: string
          enum: ["individual", "group"]
          description: Specifies wheter the conversation is between two user (individual) or multiple users (group).
          example: "individual"
        participants:
          type: array
          items:
            $ref: "#/components/schemas/User"
          description: List of usernames involved in the conversations
          minItems: 2
          maxItems: 500
        lastMessage:
          $ref: "#/components/schemas/Message"

        messages:
          type: array
          
          items: 
            $ref: "#/components/schemas/Message"
          description: List of all messages in the conversation, (displayed in reverse chronological order - later to do)
          minItems: 1
          maxItems: 1000
        updatedAt:
          $ref: "#/components/schemas/Timestamp"
    Message:
      type: object
      description: message that include strings, pictures and reaction to send in a conversation
      required: [id, sender, conversationId, contentType, timestamp]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        sender:
          $ref: "#/components/schemas/User"

        conversationId:
          $ref: "#/components/schemas/Id"
        contentType:
          type: string
          enum: ["text","image","gif"]
          description: Specifies the type of message content
          example: "text"
        contentUrl:
          $ref: "#/components/schemas/Url"
        text:
          type: string
          description: Text content of the message
          pattern: '^.*?$'
          example: "Ciao Maria"
          minLength: 1
          maxLength: 200
        timestamp:
          $ref: "#/components/schemas/Timestamp"
        deliveryStatus:
          description: object with status info and last update time stamp
          type: object
          properties:
            status:
              type: string
              description: | 
                    a string that describes the status of the message
              enum: ["sent","received","read"]

            updatedAt:
              $ref: "#/components/schemas/Timestamp"
          
        reactions:
          type: array
          items:
            $ref: '#/components/schemas/Reaction'
          description: List of reactions to the message
          minItems: 0
          maxItems: 500
        replyTo:
          $ref: "#/components/schemas/Id"

        forwardedFrom:
          $ref: "#/components/schemas/Id"

        forwardedTimestamp:
          $ref: "#/components/schemas/Timestamp"
        originalContent:
          type: string
          description: Original content of the forwarded message (text, image, or GIF URL).
          pattern: '^.*?$'
          example: "msg from the past"
          minLength: 1
          maxLength: 2048
    Reaction:
      description: reaction to a message
      type: object
      required: [id,messageId,emoji,user]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        messageId:
          $ref: "#/components/schemas/Id"
        emoji:
          type: string
          description: The emoji representing the reaction, in unicode emoji.
          example: "👍"
          pattern: '^[\u2600-\u26FF\u2700-\u27BF\u1F300-\u1F5FF\u1F600-\u1F64F\u1F680-\u1F6FF]$'

          minLength: 1
          maxLength: 2
        user:
          $ref: '#/components/schemas/User'

        createdAt:
          $ref: "#/components/schemas/Timestamp"
    Group:
      description: group object uses to form groups of conversation
      type: object
      required: [groupName, members, createdAt]
      properties: 
        groupName:
          $ref: "#/components/schemas/Uniquename"
        members:
          type: array
          items:  
            $ref: '#/components/schemas/User'
          description: | 
            List of users in the group (each member has admin privileges by default)
          minItems: 2
          maxItems: 500
        photo:
          $ref: "#/components/schemas/Url"
        createdAt:
          $ref: "#/components/schemas/Timestamp"

    ErrorResponse:
      description: Standard error response format
      type: object
      required: [error]
      properties:
        error:
          type: object
          properties:
            code:
              type: integer
              description: HTTP status code
              example: 404
            message:
              type: string
              description: Human-readable error message
              example: "Resource not found"
            details:
              type: string
              description: Additional error details
              example: "The requested conversation was not found"

    NameResponse:
      type: object
      required: [username]
      properties:
        username:
          $ref: '#/components/schemas/Uniquename'

    PhotoResponse:
      type: object
      required: [photoUrl]
      properties:
        photoUrl:
          $ref: '#/components/schemas/Url'

    StatusEntry:
      type: object
      required: [recipient, status, updatedAt]
      properties:
        recipient:
          $ref: '#/components/schemas/User'
        status:
          type: string
          enum: ["sent","received","read"]
        updatedAt:
          $ref: '#/components/schemas/Timestamp'

    MessageStatusesResponse:
      type: array
      items:
        type: object
        required: [messageId, status]
        properties:
          messageId:
            $ref: '#/components/schemas/Id'
          status:
            type: array
            items:
              $ref: '#/components/schemas/StatusEntry'
          
tags:
  - name: "Login"
    description: "Endpoints for user login and session management"
  - name: "User Management"
    description: "APIs for managing user profiles and settings"
  - name: "Conversation Management"
    description: "APIs for creating, retrieving, and managing conversations"
  - name: "Group Management"
    description: "APIs for creating and managing group chats"

# 2) Apply the security globally to all operations
security:
  - bearerAuth: [] # use the same name as above
paths:
  /session:
    
    post:
      security: [] # No security
      tags: ["Login"]
      summary: Logs in the user
      description: |
        If the user does not exist, it will be created,
        and an identifier is returned.
        If the user exists, the user identifier is returned.
      operationId: doLogin
      requestBody:
        description: User details
        required: true
        content:
          application/json:
            schema:
              description: Login request payload.
              type: object
              properties:
                username:
                  $ref: "#/components/schemas/Uniquename"
              required:
                - username
      responses:
        '201':
          description: User log-in action successful
          content:
            application/json:
              schema:
               
                type: object
                properties:
                  identifier:
                    type: string
                    description: Unique token to be used for authorization.
                    example: "abcdef012345"
                    minLength: 3
                    maxLength: 64
                  username:
                    $ref: "#/components/schemas/Uniquename"
        '400':
          description: Invalid request, missing or invalid username.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /user/name:
    patch:
      tags: ["User Management"]
      summary: Sets or updates the user's display name (initially only)
      description: |
        allows users to set their username, which cannot be modified
      operationId: setMyUserName
      requestBody:
        description: Display name to set
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NameResponse'
      responses:
        '200':
          description: Display name set successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NameResponse'
        '400':
          description: Invalid request, missing or invalid display name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '409':
          description: Conflict, username has already been set and cannot be changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /user/photo:
    patch: 
      tags: ["User Management"]
      summary: Updates the user's profile photo
      description: Allows the user to replace an existing profile image
      operationId: setMyPhoto
      requestBody: 
        required: true
        content:
          multipart/form-data:
            schema:
              description: Photo upload payload.
              type: object
              properties:
                photo:
                  description: The new photo to upload
                  minLength: 1
            encoding:
              photo:
                contentType: 'image/*'
      responses:
        "200":
          description: Profile photo updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoResponse'
        "400":
          description: Invalid request, missing or invalid photo file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /users:
    get:
      tags: ["User Management"]
      summary: Retrieves a list of all usernames
      description: |
        Allows the user to retrieve a list of all usernames in the system to create individual conversations.
      operationId: getAllUsernames
      responses:
        '200':
          description: List of usernames retrieved successfully.
          content:
            application/json:
              schema:
                description: List of usernames
                type: array
                items:
                  $ref: '#/components/schemas/Uniquename'
                minItems: 1
                maxItems: 1000
        '401':
          description: Unauthorized access, token required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /conversations:
    post:
      tags: ["Conversation Management"]
      summary: Creates a new individual conversation
      description: |
        Allows a user to create a new individual conversation by specifying the other participant's username.
        If a conversation already exists between the two users, the existing conversation ID is returned.
      operationId: createIndividualConversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: Conversation creation payload.
              type: object
              properties:
                type:
                  type: string
                  enum: ["individual", "group"]
                  description: Specifies the type of conversation.
                  example: "individual"

                recipient:
                  $ref: "#/components/schemas/Uniquename"
                initialMessage:
                  type: string
                  description: Initial message to start the conversation.
                  example: "Hello! How are you?"
                  pattern: "^.*$"
                  minLength: 1
                  maxLength: 200
              required:
                - type
                - recipient
                - initialMessage
      responses:
        '201':
          description: Individual conversation created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '400':
          description: Invalid request, missing or invalid conversation details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '409':
          description: Conflict, conversation already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '401':
          description: Unauthorized access, token required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags: ["Conversation Management"]
      summary: Retrieves the user's conversation list
      description: Returns a list of conversation of a user, with details such as the lates message and participant
      operationId: getMyConversations
      responses:
        "200":
          description: List of conversation retrieved successfully.
          content:
            application/json:
              schema:
                description: List of conversation
                type: array
                items:
                  $ref: "#/components/schemas/Conversation"
                minItems: 0
                maxItems: 1000
        "401":
          description: Unauthorized access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /conversations/{id}:
    get:
      tags: ["Conversation Management"]
      summary: Retrieves messages within a specific conversation
      description: |
        Returns all messages in the specified conversation, allowing the user to view the conversation history.
      operationId: getConversation
      parameters:
        - in: path
          name: id
          required: true
          schema:
            $ref: "#/components/schemas/Id"
      responses:
        "200":
          description: List of msgs retrieved successfully
          content:
            application/json:
              schema:
                description: list of msg 
                type: array
                items:
                  $ref: "#/components/schemas/Message"
                minItems: 1
                maxItems: 1000
          
        "404":
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '401':
          description: Unauthorized access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /messages:
    post:
      tags: ["Conversation Management"]
      summary: Sends a message in a conversation
      description: |
        sends a new msg to a specified conversation, either as text, image, or gif
      operationId: sendMessage
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              description: message send payload
              properties:
                conversationId:
                  $ref: "#/components/schemas/Id"
                contentType:
                  type: string
                  enum: ["text", "image", "gif"]
                  description: Type of message content.
                text:
                  type: string
                  description: Text content, if contentType is "text".
                  pattern: '^.*?$'
                  minLength: 1
                  maxLength: 200
                file:
                  description: File for image or GIF content.
                  minLength: 1
                  maxLength: 2048
            encoding:
              file:
                contentType: 'image/*'
      responses:
        '201':
          description: Message sent successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          description: Invalid message content or conversation ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '401':
          description: Unauthorized access, token required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /messages/{id}:
    delete:
      tags: ["Conversation Management"]
      summary: Deletes a specific message
      description: |
        Allows a user to delete their own message in a conversation. 
        Deletion may remove the message entirely or mark it as "deleted".
      operationId: deleteMessage
      parameters:
        - in: path
          name: id
          required: true
          schema:
            $ref: "#/components/schemas/Id"
          description: ID of the message to delete.
      responses:
        '204':
          description: Message deleted successfully.
          content: {}
        '404':
          description: Message not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '403':
          description: Forbidden, user cannot delete another user’s message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '401':
          description: Unauthorized access, token required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /messages/{id}/forward:
    post:
      tags: ["Conversation Management"]
      summary: Forwards a message to another conversation
      description: |
        Forwards an existing message to another specified conversation.
      operationId: forwardMessage
      parameters:
        - in: path
          name: id
          required: true
          schema:
            $ref: "#/components/schemas/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: payloed needed to find msg
              type: object
              properties:
                targetConversationId:
                  $ref: "#/components/schemas/Id"
      responses:
        '201':
          description: Message forwarded successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '404':
          description: Original message or target conversation not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '401':
          description: Unauthorized access, token required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /messages/{id}/reply:
    post:
      tags: ["Conversation Management"]
      summary: Replies to a specific message
      description: |
        Sends a reply to a specified message in the conversation.
      operationId: replyMessage
      parameters:
        - in: path
          name: id
          required: true
          schema:
            $ref: "#/components/schemas/Id"
          description: ID of the message being replied to.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: payloed needed to find msg
              type: object
              properties:
                text:
                  type: string
                  description: Reply text content.
                  pattern: '^.*?$'
                  minLength: 1
                  maxLength: 200
      responses:
        '201':
          description: Reply sent successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '404':
          description: Original message not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '401':
          description: Unauthorized access, token required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /messages/{id}/reaction:
    post:
      tags: ["Conversation Management"]
      summary: Adds a reaction to a specific message
      description: |
        Allows a user to add a reaction (e.g., emoji) to a specified message. 
        Each user can only have one reaction per message.
      operationId: commentMessage
      parameters:
        - in: path
          name: id
          required: true
          schema:
             $ref: "#/components/schemas/Id"
          description: ID of the message to react to.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: imoji needed to react the msg
              type: object
              properties:
                emoji:
                  type: string
                  description: Emoji to react with.
                  example: "👍"
                  pattern: '^[\u2600-\u26FF\u2700-\u27BF\u1F300-\u1F5FF\u1F600-\u1F64F\u1F680-\u1F6FF]$'


                  minLength: 1
                  maxLength: 8
      responses:
        '201':
          description: Reaction added successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reaction'
                    
        '400':
          description: Invalid request, missing or invalid reaction data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '409':
          description: Conflict, reaction already exists for this user and message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '401':
          description: Unauthorized access, token required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /messages/{id}/reaction/{reactionId}:
    delete:
      tags: ["Conversation Management"]
      summary: Removes a user's reaction from a message
      description: |
        Allows the user to remove their reaction from a specified message.
      operationId: uncommentMessage
      parameters:
        - in: path
          name: id
          required: true
          schema:
            $ref: "#/components/schemas/Id"
          description: ID of the message with the reaction.
        - in: path
          name: reactionId
          required: true
          schema:
            $ref: "#/components/schemas/Id"
          description: ID of the reaction to remove.
      responses:
        '204':
          description: Reaction removed successfully.
          content: {}
        '404':
          description: Message or reaction not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '403':
          description: Forbidden, user cannot delete another user’s reaction.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '401':
          description: Unauthorized access, token required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /groups:
    post:
      tags: ["Group Management"]
      summary: Creates a new group with initial members and a message
      description: |
        Allows a user to create a new group with at least 2 initial members and an initial message, by assigning a group name.
        The group name is unique and cannot be changed once set.
      operationId: setGroupName
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: payloed needed to create group
              type: object
              properties:
                groupName:
                  $ref: "#/components/schemas/Uniquename"
                members:
                  type: array
                  description: array of usernames of users to add to the group
                  items:
                    $ref: "#/components/schemas/Uniquename"
                  minItems: 2
                  maxItems: 500
                  example: ["john_doe", "jane_doe"]
                initialMessage:
                  type: string
                  description: Initial message content to start the conversation.
                  example: "Welcome to the group!"
                  pattern: "^.*$"
                  minLength: 1
                  maxLength: 200
              required:
                - groupName
                - members
                - initialMessage
      responses:
        '201':
          description: Group created successfully with initial message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '409':
          description: Conflict, group name already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '400':
          description: Invalid request, missing group name, members, or initial message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /groups/{groupName}/leave:
    post:
      tags: ["Group Management"]
      summary: Allows a member to leave the group
      description: |
        Allows a member to leave the group. This action deletes their reactions but leaves their messages intact.
        They will lose access to the group conversation after leaving.
      operationId: leaveGroup
      parameters:
        - in: path
          name: groupName
          required: true
          schema:
            $ref: "#/components/schemas/Uniquename"
          description: Unique name of the group to leave.
      responses:
        '204':
          description: Member left the group successfully.
          content: {}
        '404':
          description: Group or member not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '401':
          description: Unauthorized access, token required.    
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"     
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse' 
  /groups/{groupName}/members:
    post:
      tags: ["Group Management"]
      summary: Adds a member to a group
      description: |
        Allows a group member to add new members to a specified group.
      operationId: addToGroup
      parameters:
        - in: path
          name: groupName
          required: true
          schema:
            $ref: "#/components/schemas/Uniquename"
          description: Unique name of the group.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Uniquename"
      responses:
        '200':
          description: Member added successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NameResponse'
          
        '404':
          description: Group not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '409':
          description: Conflict, user is already a member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '401':
          description: Unauthorized access, token required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /groups/{groupName}/photo:
    patch:
      tags: ["Group Management"]
      summary: Updates the group’s profile photo
      description: |
        Allows a group member to update the profile photo of a specified group.
      operationId: setGroupPhoto
      parameters:
        - in: path
          name: groupName
          required: true
          schema:
            $ref: "#/components/schemas/Uniquename"
          description: Unique name of the group.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              description: payloed needed to add profile to group
              type: object
              properties:
                photo:
                  description: The new profile photo for the group.
              
            encoding:
              photo:
                contentType: 'image/*'
      responses:
        '200':
          description: Group photo updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoResponse'
        '404':
          description: Group not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '401':
          description: Unauthorized access, token required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /conversations/{conversationId}/messages/status:
    get:
      tags: ["Conversation Management"]
      summary: Retrieves delivery status of messages in a conversation
      description: |
        Retrieves the delivery status for each message in a conversation, indicating if they have been sent, received, or read (the comparison of time stamp and last activity must implemented later to permit the automation of checkmarks update)
      operationId: getMessageStatuses
      parameters:
        - in: path
          name: conversationId
          required: true
          schema:
             $ref: "#/components/schemas/Id"
          description: conversationId required to get the msg status.
      responses:
        '200':
          description: Delivery statuses retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageStatusesResponse'

        '404':
          description: Conversation or messages not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '401':
          description: Unauthorized access, token required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
